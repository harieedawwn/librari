<style>
:root{--bg:#fff3c4;--bg2:#ffe28a;--ink:#3b2a05;--acc:#e8a800;--card:#fffaf0;--line:#f0d27a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink)}

header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top)) 16px 12px;backdrop-filter:blur(14px);background:#fff3c4aa}

.logo i{color:var(--acc)}

.t:active{transform:scale(.96)}@media(hover:hover){.t:hover{transform:translateY(-4px) rotate(-.6deg)}}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
.t svg.bg{position:absolute;inset:0;width:100%;height:100%}
.adm .t .m{display:grid}.t .m{display:none}
.t .n{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 12px;font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(15px,4.2vw,19px);line-height:1.15;color:#fff;background:linear-gradient(transparent,#2a1c04cc);word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 6px #0006}

.dlg h3{margin:0 0 12px;font:900 22px 'Playfair Display',serif}

.dlg input:focus{border-color:var(--acc)}
.row{display:flex;gap:8px;justify-content:flex-end}
.b{padding:11px 18px;border-radius:14px;font-weight:700;background:#f5e3a3}.b.p{background:var(--ink);color:#ffe28a}.b.l{display:block;width:100%;text-align:left;margin-bottom:8px}.b.d{color:#b3261e}
.err{color:#b3261e;font-weight:600;font-size:13px;min-height:18px;margin:-4px 0 6px}

#view{position:fixed;inset:0;z-index:30;background:#000;display:none}

#vb button{width:40px;height:40px;border-radius:50%;background:#2a1c04cc;color:#ffe28a;font-size:17px;font-weight:800;backdrop-filter:blur(6px)}
#view.q #vb{opacity:.18}
.adm .fab{display:flex}
#sec{position:fixed;left:max(8px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));width:30px;height:30px;border-radius:50%;border:1.5px solid transparent;background:none;z-index:7}
#sec:hover,#sec:focus-visible{border-color:#3b2a0533;outline:none}
.pwr{position:relative}.pwr button{position:absolute;right:6px;top:6px;width:36px;height:36px;border-radius:10px;background:#f5e3a3}
.dlg input{font-size:16px!important}
.hid{display:none!important}
</style></head><body>

<script>
const HASH='a4751b67782b2f2d11706aff9822d2a721492cf282b61d3760e082967de8f615',$=s=>document.querySelector(s),E=new TextEncoder(),D=new TextDecoder(),B=document.body;
const CFG={owner:'harieedawwn',repo:'librari',branch:'main'};
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),hex=u=>[...u].map(x=>x.toString(16).padStart(2,'0')).join('');
const b64=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(s)};
const base=pw=>crypto.subtle.importKey('raw',E.encode(pw),'PBKDF2',false,['deriveBits','deriveKey']);

async function putTok(pw,t){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await ak(pw),E.encode(t));localStorage.tk=b64(iv)+'.'+b64(new Uint8Array(ct))}
async function getTok(pw){try{const[i,c]=localStorage.tk.split('.');return D.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(i)},await ak(pw),ub(c)))}catch{return null}}
const idb=(m,v)=>new Promise((ok,no)=>{const r=indexedDB.open('librari-k',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onerror=()=>no(r.error);
r.onsuccess=()=>{const s=r.result.transaction('k',m==='get'?'readonly':'readwrite').objectStore('k'),q=m==='get'?s.get('a'):m==='del'?s.delete('a'):s.put(v,'a');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}});
async function remember(t){const k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']),iv=crypto.getRandomValues(new Uint8Array(12));await idb('put',{k,iv,c:await crypto.subtle.encrypt({name:'AES-GCM',iv},k,E.encode(t))})}
async function recall(){try{const a=await idb('get');return a?D.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:a.iv},a.k,a.c)):null}catch{return null}}
/* ---------- ghi vào repo: mọi thay đổi = MỘT commit ---------- */
let TOK=null,adm=false,items=[],cur=null;const cache={};
async function api(p,m='GET',b){const r=await fetch('https://api.github.com/repos/'+CFG.owner+'/'+CFG.repo+'/'+p,{method:m,cache:'no-store',headers:{Authorization:'Bearer '+TOK,Accept:'application/vnd.github+json'},body:b?JSON.stringify(b):undefined});
if(!r.ok)throw Error('GitHub '+r.status+': '+((await r.json().catch(()=>({}))).message||''));return r.json()}
async function check(t){TOK=t;const r=await fetch('https://api.github.com/repos/'+CFG.owner+'/'+CFG.repo,{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'},cache:'no-store'});
if(r.status===401)throw Error('Token hết hạn hoặc sai');if(!r.ok)throw Error('GitHub '+r.status);const j=await r.json();if(j.permissions&&!j.permissions.push)throw Error('Token không có quyền ghi')}
async function commit(msg,files,fn){const ent=Object.entries(files);
const blobs=await Promise.all(ent.filter(e=>e[1]).map(async([path,c])=>({path,mode:'100644',type:'blob',sha:(await api('git/blobs','POST',{content:c,encoding:'base64'})).sha})));
for(let n=0;;n++){const head=(await api('git/ref/heads/'+CFG.branch)).object.sha,bt=(await api('git/commits/'+head)).tree.sha;
let j={items:[]};try{const f=await api('contents/data/library.json?ref='+head);j=JSON.parse(D.decode(ub(f.content.replace(/\n/g,''))))}catch{}

const tree=(await api('git/trees','POST',{base_tree:bt,tree:[...blobs,{path:'data/library.json',mode:'100644',type:'blob',sha:jb},...ent.filter(e=>!e[1]).map(([path])=>({path,mode:'100644',type:'blob',sha:null}))]})).sha;
const c=(await api('git/commits','POST',{message:msg,tree,parents:[head]})).sha;
try{await api('git/refs/heads/'+CFG.branch,'PATCH',{sha:c});items=j.items;render();return}catch(e){if(n>1)throw e}}}
const busy=async f=>{B.style.cursor='progress';try{await f()}catch(e){await dlg('<h3>Lỗi</h3><p>'+esc(e.message)+'</p>',false)}B.style.cursor=''};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kidsOf=x=>items.filter(y=>y.parent===x),subs=x=>kidsOf(x).flatMap(y=>[y,...subs(y.id)]);
/* ---------- họa tiết thumbnail tự tạo (theo tên + seed) ---------- */
const PAL=[['#ffb703','#fb8500','#fff1b8'],['#f9c74f','#f3722c','#fff3c4'],['#e9a800','#7a4a00','#ffe9a0'],['#ffd166','#ef8354','#4f3200'],['#f4a300','#9c5a00','#fff0b0'],['#ffcb47','#c8741a','#fff8dc'],['#fbbf24','#b45309','#fffbeb']];
function rng(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>(h=Math.imul(h^h>>>15,2246822507),h=Math.imul(h^h>>>13,3266489909),((h^=h>>>16)>>>0)/4294967296)}
function art(seed){const r=rng(seed),p=PAL[r()*PAL.length|0],k=r()*6|0,S=200;let o='';
const g='<defs><linearGradient id="a'+seed.length+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+p[0]+'"/><stop offset="1" stop-color="'+p[1]+'"/></linearGradient></defs><rect width="200" height="200" fill="url(#a'+seed.length+')"/>';
if(k==0)for(let i=0;i<9;i++)o+='<circle cx="'+r()*S+'" cy="'+r()*S+'" r="'+(14+r()*50)+'" fill="'+p[2]+'" opacity="'+(.15+r()*.3)+'"/>';
if(k==1)for(let i=0;i<8;i++)o+='<circle cx="'+(r()*S)+'" cy="'+(r()*S)+'" r="'+(20+i*14)+'" fill="none" stroke="'+p[2]+'" stroke-width="'+(2+r()*5)+'" opacity=".35"/>';
if(k==2)for(let i=0;i<7;i++)o+='<path d="M-10 '+(i*32+r()*14)+' Q 50 '+(i*32-30)+' 100 '+(i*32)+' T 210 '+(i*32+10)+'" fill="none" stroke="'+p[2]+'" stroke-width="'+(3+r()*8)+'" opacity=".35" stroke-linecap="round"/>';
if(k==3)for(let y=0;y<10;y++)for(let x=0;x<10;x++)o+='<circle cx="'+(x*22+8)+'" cy="'+(y*22+8)+'" r="'+(1+r()*7)+'" fill="'+p[2]+'" opacity=".45"/>';
if(k==4)for(let i=0;i<7;i++)o+='<polygon points="'+[0,1,2].map(()=>r()*S+','+r()*S).join(' ')+'" fill="'+p[2]+'" opacity="'+(.15+r()*.3)+'"/>';
if(k==5)for(let i=-6;i<12;i++)o+='<rect x="'+(i*24)+'" y="-20" width="'+(6+r()*14)+'" height="260" fill="'+p[2]+'" opacity=".3" transform="rotate(25 100 100)"/>';
return'<svg class="bg" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice">'+g+o+'</svg>'}
const FOLDER='<svg viewBox="0 0 120 100"><path d="M8 20a8 8 0 0 1 8-8h27l10 11h51a8 8 0 0 1 8 8v54a8 8 0 0 1-8 8H16a8 8 0 0 1-8-8z" fill="#c77d00"/><path d="M8 36a8 8 0 0 1 8-8h88a8 8 0 0 1 8 8v50a8 8 0 0 1-8 8H16a8 8 0 0 1-8-8z" fill="#ffc933"/><path d="M8 40h104" stroke="#fff6" stroke-width="3"/><rect x="8" y="36" width="104" height="58" rx="8" fill="none" stroke="#a96500" stroke-opacity=".25" stroke-width="2"/></svg>';
/* ---------- giao diện ---------- */
function render(){const kids=kidsOf(cur).sort((a,b)=>(a.type==b.type?0:a.type=='folder'?-1:1)||a.name.localeCompare(b.name,'vi'));
const path=[];for(let c=cur;c;){const f=items.find(i=>i.id===c);if(!f)break;path.unshift(f);c=f.parent}
$('#cr').innerHTML='<button data-id="">🏠 Gốc</button>'+path.map(f=>'<span>›</span><button data-id="'+f.id+'">'+esc(f.name)+'</button>').join('');
$('#cr').querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.id||null;render()});
$('#g').innerHTML=kids.length?kids.map((i,n)=>i.type=='folder'?'<div class="t f" data-id="'+i.id+'" style="animation-delay:'+n*25+'ms"><button class="m" data-m="'+i.id+'">⋯</button><div class="ic">'+FOLDER+'</div><div class="n">'+esc(i.name)+'<small>'+kidsOf(i.id).length+' mục</small></div></div>':'<div class="t" data-id="'+i.id+'" style="animation-delay:'+n*25+'ms">'+art(i.name+(i.seed||''))+'<button class="m" data-m="'+i.id+'">⋯</button><div class="n">'+esc(i.name.replace(/\.html?$/i,''))+'</div></div>').join(''):'<div class="empty" style="grid-column:1/-1"><b>Trống trơn</b>Chưa có gì ở đây</div>';
$('#g').querySelectorAll('.t').forEach(t=>t.onclick=e=>{const m=e.target.closest('.m');if(m){menu(m.dataset.m);return}const i=items.find(x=>x.id===t.dataset.id);i.type=='folder'?(cur=i.id,render(),scrollTo(0,0)):openFile(i)})}
function dlg(h,ok,okLabel='OK',init){return new Promise(res=>{const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="dlg">'+h+'<div class="row"><button class="b" data-x>Hủy</button>'+(ok===false?'':'<button class="b p" data-o>'+okLabel+'</button>')+'</div></div>';document.body.append(o);init&&init(o);const c=v=>{o.remove();res(v)};o.onclick=e=>{if(e.target==o)c(null)};o.querySelector('[data-x]').onclick=()=>c(null);const b=o.querySelector('[data-o]');b&&(b.onclick=()=>c(o));const i=o.querySelector('input');i&&(i.focus(),i.onkeydown=e=>e.key=='Enter'&&c(o));o.close=c})}
async function ask(title,val=''){const o=await dlg('<h3>'+title+'</h3><input type="text" value="'+esc(val)+'">');return o&&o.querySelector('input').value.trim()}
/* ---------- xem file: toàn màn hình, chạy tốt trên điện thoại ---------- */
let vurl=null,qt;
function openFile(i){const v=$('#view');vurl=cache[i.id]?URL.createObjectURL(new Blob([cache[i.id]],{type:'text/html'})):'files/'+i.id+'.html';const f=document.createElement('iframe');f.allow='fullscreen;autoplay;accelerometer;gyroscope;microphone;camera;clipboard-write;web-share';f.setAttribute('allowfullscreen','');f.src=vurl;v.querySelector('iframe')?.remove();v.prepend(f);v.style.display='block';v.classList.remove('q');clearTimeout(qt);qt=setTimeout(()=>v.classList.add('q'),2500);document.body.style.overflow='hidden';history.pushState({v:1},'')}
function closeView(pop){const v=$('#view');v.style.display='none';v.querySelector('iframe')?.remove();vurl&&vurl.startsWith('blob:')&&URL.revokeObjectURL(vurl);document.body.style.overflow='';if(document.fullscreenElement)document.exitFullscreen();if(!pop&&history.state&&history.state.v)history.back()}
$('#vx').onclick=()=>closeView();addEventListener('popstate',()=>$('#view').style.display=='block'&&closeView(1));
$('#vf').onclick=()=>{const v=$('#view');document.fullscreenElement?document.exitFullscreen():(v.requestFullscreen||v.webkitRequestFullscreen||(()=>{}))?.call(v)};
$('#vb').onpointerenter=$('#vb').ontouchstart=()=>{$('#view').classList.remove('q');clearTimeout(qt);qt=setTimeout(()=>$('#view').classList.add('q'),2500)};

async function menu(id){const i=items.find(x=>x.id===id),o=document.createElement('div');o.className='ov';o.innerHTML='<div class="dlg"><h3>'+esc(i.name)+'</h3><button class="b l" data-a="rn">✏️ Đổi tên</button><button class="b l" data-a="mv">📂 Chuyển vào thư mục</button>'+(i.type=='file'?'<button class="b l" data-a="sd">🎨 Đổi họa tiết</button>':'')+'<button class="b l d" data-a="rm">🗑 Xóa</button><button class="b l" data-a="x">Đóng</button></div>';document.body.append(o);
o.onclick=async e=>{const a=e.target.dataset.a;if(!a&&e.target!=o)return;o.remove();
if(a=='rn'){const n=await ask('Đổi tên',i.name);if(n)busy(()=>commit('Đổi tên '+n,{},j=>{j.items.find(x=>x.id==id).name=n}))}
if(a=='sd'){const sd=Math.random().toString(36).slice(2,6);busy(()=>commit('Đổi họa tiết',{},j=>{j.items.find(x=>x.id==id).seed=sd}))}
if(a=='rm'){const all=subs(id),r=await dlg('<h3>Xóa “'+esc(i.name)+'”?</h3><p>'+(all.length?'Xóa luôn '+all.length+' mục bên trong. ':'')+'Không thể hoàn tác.</p>','','Xóa');if(r)busy(()=>{const ids=[id,...all.map(x=>x.id)],f={};[i,...all].filter(x=>x.type=='file').forEach(x=>f['files/'+x.id+'.html']=null);return commit('Xóa '+i.name,f,j=>{j.items=j.items.filter(x=>!ids.includes(x.id))})})}
if(a=='mv'){const bad=i.type=='folder'?[id,...subs(id).map(x=>x.id)]:[],fs=items.filter(f=>f.type=='folder'&&!bad.includes(f.id)),p=x=>{const f=items.find(y=>y.id===x);return f?(f.parent?p(f.parent)+' / ':'')+f.name:''};
const m=await dlg('<h3>Chuyển tới</h3><button class="b l" data-t="">🏠 Gốc</button>'+fs.map(f=>'<button class="b l" data-t="'+f.id+'">📁 '+esc(p(f.id))+'</button>').join(''),false);if(!m)return;m.onclick=e=>{if(e.target.dataset.t===undefined)return;const t=e.target.dataset.t||null;m.close(1);busy(()=>commit('Chuyển '+i.name,{},j=>{j.items.find(x=>x.id==id).parent=t}))}}}}
/* ---------- tải lên / thư mục ---------- */
async function addFiles(fl){const f={},add=[];for(const x of fl){if(!/\.html?$/i.test(x.name)&&x.type!='text/html')continue;const id=uid(),buf=new Uint8Array(await x.arrayBuffer());f['files/'+id+'.html']=b64(buf);cache[id]=D.decode(buf);add.push({id,type:'file',parent:cur,name:x.name.replace(/\.html?$/i,'')})}
if(add.length)busy(()=>commit('Thêm '+add.length+' file',f,j=>j.items.push(...add)))}
$('#up').onclick=()=>$('#fi').click();$('#fi').onchange=e=>{addFiles(e.target.files);e.target.value=''};
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();adm&&addFiles(e.dataTransfer.files)});
$('#nf').onclick=async()=>{const n=await ask('Tên thư mục mới');if(n){const it={id:uid(),type:'folder',parent:cur,name:n};busy(()=>commit('Thư mục '+n,{},j=>j.items.push(it)))}};
/* ---------- đăng nhập (nút tàng hình góc dưới trái) ---------- */
const enter=t=>{TOK=t;adm=true;B.classList.add('adm')};
$('#sec').onclick=async()=>{if(adm)return;const t=await recall();if(t){try{await check(t);return enter(t)}catch{}}
for(;;){const d=await dlg('<h3>Đăng nhập</h3><div class="pwr"><input id="pw" type="password" placeholder="Mật khẩu" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"><button type="button" id="ey">👁</button></div><input id="tk" type="password" placeholder="'+(localStorage.tk?'Token GitHub (đã lưu)':'Token GitHub')+'" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="err" id="er">'+(window._er||'')+'</div>','','Vào',o=>{o.querySelector('#ey').onclick=()=>{const p=o.querySelector('#pw');p.type=p.type=='password'?'text':'password'}});window._er='';
if(!d)return;try{const pw=d.querySelector('#pw').value;if(await hx(pw)!==HASH)throw Error('Sai mật khẩu');const nt=d.querySelector('#tk').value.trim(),t=nt||await getTok(pw);if(!t)throw Error('Cần token GitHub');await check(t);if(nt)await putTok(pw,t);await remember(t);return enter(t)}catch(e){window._er=e.message}}}
$('#out').onclick=()=>{adm=false;TOK=null;B.classList.remove('adm');idb('del').catch(()=>{})};
fetch('data/library.json?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():{items:[]}).then(j=>{items=j.items||[]}).catch(()=>{}).finally(render);
</script></body></html>
