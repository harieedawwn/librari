<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7c948"><title>librari</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f7c948'/%3E%3Cpath d='M6 11h7l2 2h11v11H6z' fill='%238a5a00'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3c4;--bg2:#ffe28a;--ink:#3b2a05;--acc:#e8a800;--card:#fffaf0;--line:#f0d27a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink)}
body{background:radial-gradient(1200px 700px at 10% -10%,#fff9dc 0,transparent 60%),radial-gradient(900px 600px at 100% 0,#ffd75e 0,transparent 55%),linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;padding-bottom:110px}
button{font:inherit;color:inherit;cursor:pointer;border:0}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top)) 16px 12px;backdrop-filter:blur(14px);background:#fff3c4aa}
.logo{font-family:'Playfair Display',serif;font-weight:900;font-size:26px;letter-spacing:-.5px}
.logo i{color:var(--acc)}
.crumbs{flex:1;display:flex;gap:4px;align-items:center;overflow-x:auto;white-space:nowrap;scrollbar-width:none;font-size:14px;font-weight:600}
.crumbs button{background:#fff8;padding:6px 10px;border-radius:99px}
.crumbs button:last-child{background:var(--ink);color:#ffe28a}
.ib{width:40px;height:40px;border-radius:12px;background:#fffa;display:grid;place-items:center;font-size:18px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:8px 16px 16px;max-width:1400px;margin:auto}
.t{position:relative;aspect-ratio:1;border-radius:22px;overflow:hidden;background:var(--card);box-shadow:0 6px 18px #8a5a0033,inset 0 0 0 1.5px #fff8;cursor:pointer;transition:transform .15s;animation:pop .35s both}
.t:active{transform:scale(.96)}@media(hover:hover){.t:hover{transform:translateY(-4px) rotate(-.6deg)}}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
.t svg.bg{position:absolute;inset:0;width:100%;height:100%}
.t .n{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 12px;font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(15px,4.2vw,19px);line-height:1.15;color:#fff;background:linear-gradient(transparent,#2a1c04cc);word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 6px #0006}
.t.f{background:linear-gradient(160deg,#fff3c9,#ffd24d)}
.t.f .ic{position:absolute;inset:10% 10% 28%;display:grid;place-items:center}
.t.f .ic svg{width:100%;height:100%;filter:drop-shadow(0 6px 6px #8a5a0044)}
.t.f .n{background:none;color:var(--ink);text-shadow:none;padding:0 12px 12px}
.t.f small{display:block;font:600 11px 'Be Vietnam Pro';opacity:.6;margin-top:2px}
.m{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:#fffd;font-weight:800;line-height:1;display:grid;place-items:center;z-index:2}
.empty{text-align:center;padding:60px 24px;opacity:.7;font-weight:600}
.empty b{display:block;font:900 28px 'Playfair Display',serif;margin-bottom:8px}
.fab{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:6;pointer-events:none}
.fab button{pointer-events:auto;padding:14px 20px;border-radius:99px;font-weight:800;background:var(--ink);color:#ffe28a;box-shadow:0 8px 22px #3b2a0555}
.fab button.s{background:#fffd;color:var(--ink)}
.ov{position:fixed;inset:0;z-index:20;background:#3b2a0599;display:grid;place-items:center;padding:20px;backdrop-filter:blur(4px)}
.dlg{width:min(420px,100%);max-height:85dvh;overflow:auto;background:var(--card);border-radius:24px;padding:20px;box-shadow:0 20px 60px #0006}
.dlg h3{margin:0 0 12px;font:900 22px 'Playfair Display',serif}
.dlg input[type=text],.dlg input[type=password]{width:100%;padding:13px 14px;font:inherit;border-radius:14px;border:2px solid var(--line);background:#fff;margin-bottom:12px;outline:0}
.dlg input:focus{border-color:var(--acc)}
.row{display:flex;gap:8px;justify-content:flex-end}
.b{padding:11px 18px;border-radius:14px;font-weight:700;background:#f5e3a3}.b.p{background:var(--ink);color:#ffe28a}.b.l{display:block;width:100%;text-align:left;margin-bottom:8px}.b.d{color:#b3261e}
.err{color:#b3261e;font-weight:600;font-size:13px;min-height:18px;margin:-4px 0 6px}
#lock{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#fff3c4,#ffd24d)}
#lock .dlg{text-align:center}#lock .logo{font-size:44px;display:block;margin-bottom:6px}
#view{position:fixed;inset:0;z-index:30;background:#000;display:none}
#view iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#vb{position:absolute;top:max(8px,env(safe-area-inset-top));right:8px;z-index:2;display:flex;gap:6px;opacity:.85;transition:opacity .3s}
#vb button{width:40px;height:40px;border-radius:50%;background:#2a1c04cc;color:#ffe28a;font-size:17px;font-weight:800;backdrop-filter:blur(6px)}
#view.q #vb{opacity:.18}
.hid{display:none!important}
</style></head><body>
<div id="lock"><div class="dlg"><span class="logo">libr<i>a</i>ri</span><p style="margin:0 0 14px;opacity:.7;font-weight:600">Kho lưu trữ file HTML</p><input type="password" id="pw" placeholder="Mật khẩu" autocomplete="current-password"><div class="err" id="le"></div><button class="b p" style="width:100%" id="lb">Mở khóa</button></div></div>
<header><span class="logo">libr<i>a</i>ri</span><div class="crumbs" id="cr"></div><button class="ib" id="bk" title="Sao lưu / khôi phục">⇅</button><button class="ib" id="lo" title="Khóa">🔒</button></header>
<main><div class="grid" id="g"></div></main>
<div class="fab"><button class="s" id="nf">📁 Thư mục</button><button id="up">＋ Tải HTML lên</button></div>
<input type="file" id="fi" accept=".html,.htm,text/html" multiple hidden><input type="file" id="ri" accept=".json" hidden>
<div id="view"><div id="vb"><button id="vf" title="Toàn màn hình">⛶</button><button id="vx" title="Đóng">✕</button></div></div>
<script>
const HASH='a4751b67782b2f2d11706aff9822d2a721492cf282b61d3760e082967de8f615',$=s=>document.querySelector(s),E=new TextEncoder();
const hx=async p=>{const k=await crypto.subtle.importKey('raw',E.encode(p),'PBKDF2',false,['deriveBits']);return[...new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:E.encode('librari-v1'),iterations:200000,hash:'SHA-256'},k,256))].map(x=>x.toString(16).padStart(2,'0')).join('')};
/* ---------- lưu trữ: IndexedDB (bền, xin persist) ---------- */
const db=new Promise((ok,no)=>{const r=indexedDB.open('librari',1);r.onupgradeneeded=()=>r.result.createObjectStore('i',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=async(m,f)=>{const d=await db;return new Promise((ok,no)=>{const t=d.transaction('i',m),s=t.objectStore('i'),r=f(s);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)})};
const all=()=>tx('readonly',s=>s.getAll()),put=o=>tx('readwrite',s=>s.put(o)),del=id=>tx('readwrite',s=>s.delete(id));
navigator.storage&&navigator.storage.persist&&navigator.storage.persist();
let items=[],cur=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- họa tiết thumbnail tự tạo (theo tên + seed) ---------- */
const PAL=[['#ffb703','#fb8500','#fff1b8'],['#f9c74f','#f3722c','#fff3c4'],['#e9a800','#7a4a00','#ffe9a0'],['#ffd166','#ef8354','#4f3200'],['#f4a300','#9c5a00','#fff0b0'],['#ffcb47','#c8741a','#fff8dc'],['#fbbf24','#b45309','#fffbeb']];
function rng(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>(h=Math.imul(h^h>>>15,2246822507),h=Math.imul(h^h>>>13,3266489909),((h^=h>>>16)>>>0)/4294967296)}
function art(seed){const r=rng(seed),p=PAL[r()*PAL.length|0],k=r()*6|0,S=200;let o='';
const g='<defs><linearGradient id="a'+seed.length+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+p[0]+'"/><stop offset="1" stop-color="'+p[1]+'"/></linearGradient></defs><rect width="200" height="200" fill="url(#a'+seed.length+')"/>';
if(k==0)for(let i=0;i<9;i++)o+='<circle cx="'+r()*S+'" cy="'+r()*S+'" r="'+(14+r()*50)+'" fill="'+p[2]+'" opacity="'+(.15+r()*.3)+'"/>';
if(k==1)for(let i=0;i<8;i++)o+='<circle cx="'+(r()*S)+'" cy="'+(r()*S)+'" r="'+(20+i*14)+'" fill="none" stroke="'+p[2]+'" stroke-width="'+(2+r()*5)+'" opacity=".35"/>';
if(k==2)for(let i=0;i<7;i++)o+='<path d="M-10 '+(i*32+r()*14)+' Q 50 '+(i*32-30)+' 100 '+(i*32)+' T 210 '+(i*32+10)+'" fill="none" stroke="'+p[2]+'" stroke-width="'+(3+r()*8)+'" opacity=".35" stroke-linecap="round"/>';
if(k==3)for(let y=0;y<10;y++)for(let x=0;x<10;x++)o+='<circle cx="'+(x*22+8)+'" cy="'+(y*22+8)+'" r="'+(1+r()*7)+'" fill="'+p[2]+'" opacity=".45"/>';
if(k==4)for(let i=0;i<7;i++)o+='<polygon points="'+[0,1,2].map(()=>r()*S+','+r()*S).join(' ')+'" fill="'+p[2]+'" opacity="'+(.15+r()*.3)+'"/>';
if(k==5)for(let i=-6;i<12;i++)o+='<rect x="'+(i*24)+'" y="-20" width="'+(6+r()*14)+'" height="260" fill="'+p[2]+'" opacity=".3" transform="rotate(25 100 100)"/>';
return'<svg class="bg" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice">'+g+o+'</svg>'}
const FOLDER='<svg viewBox="0 0 120 100"><path d="M8 20a8 8 0 0 1 8-8h27l10 11h51a8 8 0 0 1 8 8v54a8 8 0 0 1-8 8H16a8 8 0 0 1-8-8z" fill="#c77d00"/><path d="M8 36a8 8 0 0 1 8-8h88a8 8 0 0 1 8 8v50a8 8 0 0 1-8 8H16a8 8 0 0 1-8-8z" fill="#ffc933"/><path d="M8 40h104" stroke="#fff6" stroke-width="3"/><rect x="8" y="36" width="104" height="58" rx="8" fill="none" stroke="#a96500" stroke-opacity=".25" stroke-width="2"/></svg>';
/* ---------- giao diện ---------- */
function render(){const kids=items.filter(i=>i.parent===cur).sort((a,b)=>(a.type==b.type?0:a.type=='folder'?-1:1)||a.name.localeCompare(b.name,'vi'));
const path=[];for(let c=cur;c;){const f=items.find(i=>i.id===c);if(!f)break;path.unshift(f);c=f.parent}
$('#cr').innerHTML='<button data-id="">🏠 Gốc</button>'+path.map(f=>'<span>›</span><button data-id="'+f.id+'">'+esc(f.name)+'</button>').join('');
$('#cr').querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.id||null;render()});
$('#g').innerHTML=kids.length?kids.map((i,n)=>i.type=='folder'?'<div class="t f" data-id="'+i.id+'" style="animation-delay:'+n*25+'ms"><button class="m" data-m="'+i.id+'">⋯</button><div class="ic">'+FOLDER+'</div><div class="n">'+esc(i.name)+'<small>'+items.filter(x=>x.parent===i.id).length+' mục</small></div></div>':'<div class="t" data-id="'+i.id+'" style="animation-delay:'+n*25+'ms">'+art(i.name+(i.seed||''))+'<button class="m" data-m="'+i.id+'">⋯</button><div class="n">'+esc(i.name.replace(/\.html?$/i,''))+'</div></div>').join(''):'<div class="empty" style="grid-column:1/-1"><b>Trống trơn</b>Bấm “＋ Tải HTML lên” hoặc kéo thả file vào đây</div>';
$('#g').querySelectorAll('.t').forEach(t=>t.onclick=e=>{const m=e.target.closest('.m');if(m){menu(m.dataset.m);return}const i=items.find(x=>x.id===t.dataset.id);i.type=='folder'?(cur=i.id,render(),scrollTo(0,0)):openFile(i)})}
function dlg(h,ok,okLabel='OK'){return new Promise(res=>{const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="dlg">'+h+'<div class="row"><button class="b" data-x>Hủy</button>'+(ok===false?'':'<button class="b p" data-o>'+okLabel+'</button>')+'</div></div>';document.body.append(o);const c=v=>{o.remove();res(v)};o.onclick=e=>{if(e.target==o)c(null)};o.querySelector('[data-x]').onclick=()=>c(null);const b=o.querySelector('[data-o]');b&&(b.onclick=()=>c(o));const i=o.querySelector('input');i&&(i.focus(),i.onkeydown=e=>e.key=='Enter'&&c(o));o.close=c})}
async function ask(title,val=''){const o=await dlg('<h3>'+title+'</h3><input type="text" value="'+esc(val)+'">');return o&&o.querySelector('input').value.trim()}
async function menu(id){const i=items.find(x=>x.id===id),o=document.createElement('div');o.className='ov';o.innerHTML='<div class="dlg"><h3>'+esc(i.name)+'</h3><button class="b l" data-a="rn">✏️ Đổi tên</button><button class="b l" data-a="mv">📂 Chuyển vào thư mục</button>'+(i.type=='file'?'<button class="b l" data-a="sd">🎨 Đổi họa tiết</button><button class="b l" data-a="dl">⬇️ Tải về</button>':'')+'<button class="b l d" data-a="rm">🗑 Xóa</button><button class="b l" data-a="x">Đóng</button></div>';document.body.append(o);
o.onclick=async e=>{const a=e.target.dataset.a;if(!a&&e.target!=o)return;o.remove();if(a=='rn'){const n=await ask('Đổi tên',i.name);if(n){i.name=n;await put(i);render()}}
if(a=='sd'){i.seed=Math.random().toString(36).slice(2,6);await put(i);render()}
if(a=='dl'){const u=URL.createObjectURL(new Blob([i.html],{type:'text/html'})),l=document.createElement('a');l.href=u;l.download=i.name.replace(/\.html?$/i,'')+'.html';l.click();setTimeout(()=>URL.revokeObjectURL(u),5e3)}
if(a=='rm'){const n=items.filter(x=>x.parent===id).length;const r=await dlg('<h3>Xóa “'+esc(i.name)+'”?</h3><p>'+(i.type=='folder'?'Xóa luôn '+n+' mục bên trong. ':'')+'Không thể hoàn tác.</p>','','Xóa');if(r){const rm=async x=>{for(const c of items.filter(y=>y.parent===x))await rm(c.id);await del(x)};await rm(id);items=await all();render()}}
if(a=='mv'){const desc=x=>items.filter(y=>y.parent===x).flatMap(y=>[y.id,...desc(y.id)]),bad=i.type=='folder'?[id,...desc(id)]:[],fs=items.filter(f=>f.type=='folder'&&!bad.includes(f.id)),p=x=>{const f=items.find(y=>y.id===x);return f?(f.parent?p(f.parent)+' / ':'')+f.name:''};
const m=await dlg('<h3>Chuyển tới</h3><button class="b l" data-t="">🏠 Gốc</button>'+fs.map(f=>'<button class="b l" data-t="'+f.id+'">📁 '+esc(p(f.id))+'</button>').join(''),false);if(!m)return;m.onclick=async e=>{if(e.target.dataset.t===undefined)return;i.parent=e.target.dataset.t||null;await put(i);m.close(1);render()}}}}
/* ---------- xem file: toàn màn hình, chạy tốt trên điện thoại ---------- */
let vurl=null,qt;
function openFile(i){const v=$('#view');vurl=URL.createObjectURL(new Blob([i.html],{type:'text/html'}));const f=document.createElement('iframe');f.allow='fullscreen;autoplay;accelerometer;gyroscope;microphone;camera;clipboard-write;web-share';f.setAttribute('allowfullscreen','');f.src=vurl;v.querySelector('iframe')?.remove();v.prepend(f);v.style.display='block';v.classList.remove('q');clearTimeout(qt);qt=setTimeout(()=>v.classList.add('q'),2500);document.body.style.overflow='hidden';history.pushState({v:1},'')}
function closeView(pop){const v=$('#view');v.style.display='none';v.querySelector('iframe')?.remove();vurl&&URL.revokeObjectURL(vurl);document.body.style.overflow='';if(document.fullscreenElement)document.exitFullscreen();if(!pop&&history.state&&history.state.v)history.back()}
$('#vx').onclick=()=>closeView();addEventListener('popstate',()=>$('#view').style.display=='block'&&closeView(1));
$('#vf').onclick=()=>{const v=$('#view');document.fullscreenElement?document.exitFullscreen():(v.requestFullscreen||v.webkitRequestFullscreen||(()=>{}))?.call(v)};
$('#vb').onpointerenter=$('#vb').ontouchstart=()=>{$('#view').classList.remove('q');clearTimeout(qt);qt=setTimeout(()=>$('#view').classList.add('q'),2500)};
/* ---------- tải lên / thư mục / sao lưu ---------- */
async function addFiles(fl){let n=0;for(const f of fl){if(!/\.html?$/i.test(f.name)&&f.type!='text/html')continue;await put({id:uid(),type:'file',parent:cur,name:f.name.replace(/\.html?$/i,''),html:await f.text(),created:Date.now()});n++}items=await all();render()}
$('#up').onclick=()=>$('#fi').click();$('#fi').onchange=e=>{addFiles(e.target.files);e.target.value=''};
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();addFiles(e.dataTransfer.files)});
$('#nf').onclick=async()=>{const n=await ask('Tên thư mục mới');if(n){await put({id:uid(),type:'folder',parent:cur,name:n,created:Date.now()});items=await all();render()}};
$('#bk').onclick=async()=>{const m=await dlg('<h3>Sao lưu</h3><button class="b l" data-a="e">⬇️ Xuất tất cả ra file .json</button><button class="b l" data-a="i">⬆️ Khôi phục từ file .json</button>',false);if(!m)return;m.onclick=async e=>{const a=e.target.dataset.a;if(!a)return;m.close(1);if(a=='e'){const u=URL.createObjectURL(new Blob([JSON.stringify(items)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='librari-backup.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),5e3)}else $('#ri').click()}};
$('#ri').onchange=async e=>{try{for(const o of JSON.parse(await e.target.files[0].text()))await put(o);items=await all();render()}catch{}e.target.value=''};
/* ---------- khóa ---------- */
async function unlock(){const e=$('#le');e.textContent='';try{if(await hx($('#pw').value)!==HASH){e.textContent='Sai mật khẩu';return}}catch{e.textContent='Trình duyệt không hỗ trợ';return}localStorage.lbOK=HASH.slice(0,16);start()}
async function start(){$('#lock').classList.add('hid');items=await all();render()}
$('#lb').onclick=unlock;$('#pw').onkeydown=e=>e.key=='Enter'&&unlock();
$('#lo').onclick=()=>{localStorage.removeItem('lbOK');location.reload()};
localStorage.lbOK===HASH.slice(0,16)?start():$('#pw').focus();
</script></body></html>
